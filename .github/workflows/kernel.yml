name: Build kernels

on:
  workflow_dispatch:

jobs:
  Read-configuration:
    name: 🐂 Parse *.config.json
    runs-on: ubuntu-22.04
    outputs:
      CONFIGS: ${{ steps.generate-matrix.outputs.CONFIGS }}
      BUILD_DATE: ${{ steps.generate-builddate.outputs.BUILDDATE }}
    steps:
      - name: 😄 Checkout
        uses: actions/checkout@v4

      - name: 😆 Generate Matrix
        id: generate-matrix
        run: |
          echo "CONFIGS<<EOF" >> $GITHUB_OUTPUT
          jq -s '[.[][]]' Kernel/configs/*.config.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: ⏰ Set builddate
        id: generate-builddate
        run: echo "BUILDDATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-22.04
    needs:
      - Read-configuration
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        CONFIG: ${{ fromJSON(needs.Read-configuration.outputs.CONFIGS) }}
    env:
      WORKSPACE: ${{ github.workspace }}
      BUILD_DATE: "${{ needs.Read-configuration.outputs.BUILD_DATE }}"
      KERNEL_NAME: ${{ matrix.CONFIG.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.CONFIG.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.CONFIG.kernelSource.branch }}
      KERNEL_DEVICE: ${{ matrix.CONFIG.kernelSource.device }}
      KERNEL_DEFCONFIG_PATH: ${{ matrix.CONFIG.kernelSource.defconfig }}
      ENABLE_CCACHE: ${{ matrix.CONFIG.enableCcache }}
      USE_ANYKERNEL3: ${{ matrix.CONFIG.AnyKernel3.use }}
      CONFIRM_RELEASE: ${{ matrix.CONFIG.AnyKernel3.release }}
      ENABLE_KERNELSU: ${{ matrix.CONFIG.enableKernelSU }}
      ENABLE_LXC: ${{ matrix.CONFIG.enableLXC }}
      OUT_DIR: "${{ github.workspace }}/out"
      CCACHE_DIR: "${{ github.workspace }}/ccache"
    steps:
      - name: 😄 Checkout
        uses: actions/checkout@v4

      - name: ⭐ Install prerequisites
        run: |
          cat /etc/os-release
          sudo apt-get update
          sudo apt-get install -y cpio curl git ftp lftp wget libarchive-tools ccache python2 python2-dev python3
          sudo apt-get install -y pngcrush schedtool dpkg-dev liblz4-tool make optipng maven device-tree-compiler 
          sudo apt-get install -y libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc
          sudo apt-get install -y libxml2-utils libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools lzop flex tree
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl 
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar llvm g++-multilib bison gperf zlib1g-dev automake
          wget https://github.com/MIGHTYBLANK001/Android-Builder/releases/download/tool/utils.tar.gz
          tar xvf utils.tar.gz
          sudo cp src/mkdtboimg.py /usr/bin/mkdtimg
          sudo chmod a+x /usr/bin/mkdtimg          
      - name: Cleanup
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 12288
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          
      - name: Workaround for running out of disk space
        run: |
          sudo rm -rf /usr/share/dotnet > /dev/null 2>&1
          sudo rm -rf /opt/ghc > /dev/null 2>&1
          sudo rm -rf /usr/local/share/boost > /dev/null 2>&1
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" > /dev/null 2>&1      
      
      - name: 🚄 Setup ccache
        if: ${{ env.ENABLE_CCACHE == 'true' }}
        id: hash
        run: |
          mkdir -p ${{ env.OUT_DIR }}
          ccache -o compression=false -o cache_dir=${{ env.CCACHE_DIR }}
          echo $(echo -n '${{ toJSON(matrix.config) }}' | openssl dgst -sha1 | awk '{print $2}')
          echo "HASH=$(echo -n '${{ toJSON(matrix.config) }}' | openssl dgst -sha1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: 🚅 Cache ccache & output
        env:
          HASH: ${{ steps.hash.outputs.HASH }}
        if: ${{ env.ENABLE_CCACHE == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.OUT_DIR }}
            ${{ env.CCACHE_DIR }}
          key: cache-${{ env.KERNEL_NAME }}-${{env.HASH}}-${{ env.BUILD_DATE }}
          restore-keys: |
            cache-${{ env.KERNEL_NAME }}-${{env.HASH}}-${{ env.BUILD_DATE }}
            cache-${{ env.KERNEL_NAME }}-${{env.HASH}}-
            cache-${{ env.KERNEL_NAME }}-

      - name: 🌟 Clone kernel source => (${{ env.KERNEL_REPO }})
        run: |
          git clone --recursive --depth=1 -j $(nproc) --branch ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }}


      - name: 💫 Get toolchains
        env:
          toolchains: "${{ toJSON(matrix.CONFIG.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          echo "🤔 There is $toolchains_num defined toolchains."
          for ((i=0;i<toolchains_num;i++)); do
            toolchain=$(echo $toolchains | jq -r ".[$i]")
            toolchain_name=$(echo $toolchain | jq -r ".name")
            if echo $toolchain | jq -e 'has("url")' > /dev/null; then
              toolchain_url=$(echo $toolchain | jq -r ".url")
              mkdir -p $toolchain_name
              wget "$toolchain_url"
              filename="${toolchain_url##*/}"
              case "$filename" in
                *.zip)
                  unzip -d $toolchain_name "$filename"
                  ;;
                *.tar)
                  tar xvf "$filename" -C $toolchain_name
                  ;;
                *.tar.gz)
                  tar zxvf "$filename" -C $toolchain_name
                  ;;
                *.rar)
                  unrar x "$filename" $toolchain_name
                  ;;
                *)
                  echo "unknown file type: $filename"
                  ;;
              esac
              rm $filename
              echo "🤔 Download $toolchain_name => ($toolchain_url)"
            else
              toolchain_repo=$(echo $toolchain | jq -r ".repo")
              toolchain_branch=$(echo $toolchain | jq -r ".branch")
              git clone --recursive --depth=1 -j $(nproc) --branch $toolchain_branch $toolchain_repo $toolchain_name
              echo "🤔 Clone $toolchain_name => ($toolchain_repo)"
            fi
            jq -r ".binaryEnv[] | tostring" <<< "$toolchain" | while read -r subPath; do
              echo "${{ env.WORKSPACE }}/$toolchain_name/$subPath" >> $GITHUB_PATH
            done
          done

      - name: 😎 Set build args
        id: generate-args
        env:
          PARAMS: "${{ toJSON(matrix.CONFIG.params) }}"
          THREAD: $(nproc --all)
        run: |
          echo "🤔 PATH Variable: $PATH"
          ARCH=$(echo $PARAMS | jq -r ".ARCH")
          CC=$(echo $PARAMS | jq -r ".CC")
          args="-j${{ env.THREAD }} O=${{ env.OUT_DIR }} ARCH=$ARCH"
          if [ -n "$CC" ]; then
            if [[ "$CC" == *"/"* ]]; then
              CC=${{ env.WORKSPACE }}/$CC
            fi
            if [ ${{ env.ENABLE_CCACHE }} = true ]; then
              args="$args CC=\"ccache $CC\""
            else
              args="$args CC=$CC"
            fi
          fi
          while read -r externalCommand; do
            key=$(echo "$externalCommand" | cut -d= -f1)
            value=$(echo "$externalCommand" | cut -d= -f2)
            if [[ "$value" == *"/"* ]]; then
              value="${{ env.WORKSPACE }}/$value"
            fi
            args="$args $key=$value"
          done < <(jq -r '.externalCommands | to_entries[] | "\(.key)=\(.value)"' <<< "$PARAMS")
          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT
          echo "ARGS=$args" >> $GITHUB_OUTPUT
          echo "🤔 $args"

      - name: 😋 Setup KernelSU
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        if: ${{ env.ENABLE_KERNELSU == 'true' }}
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
          echo -e "CONFIG_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          echo -e "CONFIG_HAVE_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          echo -e "CONFIG_KPROBE_EVENTS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}
          cat arch/${{ env.ARCH }}/configs/${{ env.KERNEL_DEFCONFIG_PATH }}

      - name: 😋 Setup LXC docker (Integrated & Verified)
        env:
          DEVICE_NAME: ${{ matrix.CONFIG.kernelSource.device }}
          UTILS_URL: "https://github.com/MIGHTYBLANK001/Android-Builder/releases/download/tool/LXC_utils.zip"
        run: |
          set -e
          echo "🛠️ [START] 开始全自动化补丁流程..."
          cd ${{ github.workspace }}/${{ env.KERNEL_NAME }}

          # 1. 环境准备
          wget -q "${{ env.UTILS_URL }}" -O LXC_utils.zip
          unzip -o LXC_utils.zip -d utils && rm -f LXC_utils.zip
          echo "✅ [1/5] 工具包就绪，检测到补丁: $(ls utils/*.patch | xargs -n1 basename)"

          # 2. 注入 Kconfig 菜单与 Defconfig 配置
          sed -i '/mainmenu/a source "utils/Kconfig"' Kconfig
          DEFCONFIG="arch/arm64/configs/${{ env.DEVICE_NAME }}_defconfig"
          if [ -f "$DEFCONFIG" ]; then
              sed -i '/CONFIG_DOCKER/d' "$DEFCONFIG"
              echo "CONFIG_DOCKER=y" >> "$DEFCONFIG"
              sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' "$DEFCONFIG"
              echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> "$DEFCONFIG"
              echo "✅ [2/5] Kconfig 注入 & Defconfig ($DEVICE_NAME) 优化完成"
          fi

          # 3. 补丁 1: Cgroup 兼容性 (runcpatch.sh)
          chmod +x utils/runcpatch.sh
          CGROUP_FILE=$(find kernel -name "cgroup.c" | head -n 1)
          if [ -n "$CGROUP_FILE" ]; then
              bash utils/runcpatch.sh "$CGROUP_FILE"
              # 校验：检查关键函数是否成功注入
              grep -q "kernfs_create_link" "$CGROUP_FILE" && echo "✅ [3/5] Cgroup 补丁 (Fix RUNC) 应用成功" || { echo "❌ Cgroup 补丁失败"; exit 1; }
          fi

          # 4. 补丁 2: xt_qtaguid Panic 修复 (核心补丁)
          QTAGUID_SRC="net/netfilter/xt_qtaguid.c"
          if [ -f "$QTAGUID_SRC" ]; then
              # 尝试应用补丁，如果已存在则跳过
              patch -p1 < utils/xt_qtaguid.patch || patch -p0 < utils/xt_qtaguid.patch || echo "⚠️ xt_qtaguid 可能已手动修改"
              # 深度校验：确保 stats 指向 no_dev_stats
              grep -q "stats = &no_dev_stats;" "$QTAGUID_SRC" && echo "✅ [4/5] xt_qtaguid Panic 补丁应用成功" || { echo "❌ xt_qtaguid 补丁校验失败"; exit 1; }
          fi

          # 5. 补丁 3: Fix Panic (额外稳定性补丁)
          # 这个补丁通常针对 binder 或其他容器敏感模块
          if [ -f "utils/fix_panic.patch" ]; then
              patch -p1 < utils/fix_panic.patch || echo "⚠️ fix_panic.patch 跳过或不匹配"
              echo "✅ [5/5] fix_panic 补丁处理完成"
          fi

          echo "🏁 [FINISH] 所有 3 个补丁及配置已全部就绪！"

      - name: 🔍 Docker Config Validation
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          echo "==== 🧬 准备生成 .config 进行校验 ===="
          # 1. 生成初始 .config 文件 (基于你的设备 defconfig)
          make O=out ARCH=arm64 ${{ matrix.CONFIG.kernelSource.defconfig }}

          echo "==== 📥 下载 Docker 官方校验脚本 ===="
          curl -sSL https://raw.githubusercontent.com/moby/moby/master/contrib/check-config.sh > check-config.sh
          chmod +x check-config.sh

          echo "==== 📊 执行内核配置审计 (Audit) ===="
          # 指向生成的 .config 文件执行检测
          # 我们使用 '|| true' 是为了防止脚本因为某些非致命错误 (如缺失存储驱动) 导致工作流中断
          ./check-config.sh out/.config || true

          echo "==== 📋 审计关键项二次确认 ===="
          # 检查几个 Docker 必须的硬性指标
          MISSING_CRITICAL=$(./check-config.sh out/.config | grep -E "missing|required" | grep -v "optional" || true)
          
          if [ -n "$MISSING_CRITICAL" ]; then
            echo "⚠️ 发现缺失的关键 Docker 配置项:"
            echo "$MISSING_CRITICAL"
            echo "------------------------------------"
            echo "💡 建议: 请检查你的 LXC_defconfig.txt 或 Kconfig 注入是否完整。"
          else
            echo "✅ 所有核心 Docker 配置项均已就绪！"
          fi
          
      - name: 👍 Start building the kernel
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          ARGS: ${{ steps.generate-args.outputs.ARGS }}
        run: |
          echo "🤔 PATH Variable: $PATH"
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          make ${{ env.ARGS }} ${{ env.KERNEL_DEFCONFIG_PATH }}
          make ${{ env.ARGS }}

      - name: 💛 Upload Image
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Image
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: 💙 Upload Image.gz
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Image.gz
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: 💙 Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Image.gz-dtb
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: 💜 Upload dtb
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-dtb
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: ❤️ Upload dtbo.img
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-dtbo.img
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7

      - name: ☢️ Upload output directory
        uses: actions/upload-artifact@v4
        env:
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: ${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}-Output
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/
          retention-days: 7

      - name: ⏰ Pack Anykernel3
        if: ${{ env.USE_ANYKERNEL3 == 'true' }}
        env:
          PARAMS: "${{ toJSON(matrix.CONFIG.AnyKernel3) }}"
          ARCH: ${{ steps.generate-args.outputs.ARCH }}
          ANYKERNEL3_FILE: "${{ env.WORKSPACE }}/AnyKernel3-${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}"
        run: |
          if echo -n '${{ env.PARAMS }}' | jq -e 'has("custom")' > /dev/null; then
            CUSTOM_ANYKERNEL3=$(echo -n '${{ env.PARAMS }}' | jq -r ".custom")
            ANYKERNEL_REPO=$(echo $CUSTOM_ANYKERNEL3 | jq -r ".repo")
            ANYKERNEL_BRANCH=$(echo $CUSTOM_ANYKERNEL3 | jq -r ".branch")
            git clone --recursive --depth=1 -j $(nproc) --branch $ANYKERNEL_BRANCH $ANYKERNEL_REPO AnyKernel3
            echo "🤔 Use custom AnyKernel3 => ($ANYKERNEL_REPO)"
          else
            git clone --recursive --depth=1 -j $(nproc) https://github.com/osm0sis/AnyKernel3 AnyKernel3
            
            # --- AnyKernel3 脚本自动化配置 ---
            # 1. 关闭设备型号检查
            sed -i 's/^do.devicecheck=.*/do.devicecheck=0;/g' AnyKernel3/anykernel.sh
            # 2. 自动识别 Boot 分区路径
            sed -i 's/^[Bb][Ll][Oo][Cc][Kk]=.*/block=auto;/g' AnyKernel3/anykernel.sh
            # 3. 自动识别 A/B 分区
            sed -i 's/^[Ii][Ss]_[Ss][Ll][Oo][Tt]_[Dd][Ee][Vv][Ii][Cc][Ee]=.*/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
            # 4. 设置补丁校验位 (VBMETA)
            sed -i 's/^patch_vbmeta_flag=.*/patch_vbmeta_flag=auto;/g' AnyKernel3/anykernel.sh
            
            # --- 🚀 新增：DTBO 自动化配置 ---
            # 5. 开启 DTBO 分区自动识别
            if grep -q "dtbo_block=" AnyKernel3/anykernel.sh; then
              sed -i 's/^dtbo_block=.*/dtbo_block=auto;/g' AnyKernel3/anykernel.sh
            else
              # 如果变量不存在，在 block=auto 下方插入
              sed -i '/block=auto;/a dtbo_block=auto;' AnyKernel3/anykernel.sh
            fi

            # 6. 在 write_boot 后注入 flash_dtbo 指令
            if ! grep -q "flash_dtbo" AnyKernel3/anykernel.sh; then
              sed -i '/write_boot;/a \\n## dtbo install\nif [ -f "dtbo.img" ]; then\n  ui_print "  • Flashing dtbo.img...";\n  flash_dtbo;\nfi' AnyKernel3/anykernel.sh
            fi
            
            echo "✅ AnyKernel3 configuration patched with DTBO support."
          fi

          # --- 📦 拷贝编译产物 ---
          # 拷贝内核 (Image / Image.gz-dtb 等)
          find ${{ env.OUT_DIR }}/arch/arm64/boot -maxdepth 1 -name "Image*" -exec cp -f {} AnyKernel3/ \;
          
          # 拷贝 DTBO (核心动作)
          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/dtbo.img" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
            echo "📦 Copied dtbo.img to AnyKernel3"
          elif [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/dtbo" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/arm64/boot/dtbo AnyKernel3/dtbo.img
            echo "📦 Copied dtbo (renamed to dtbo.img) to AnyKernel3"
          fi

          # 打包
          cd AnyKernel3/
          zip -q -r "${{ env.ANYKERNEL3_FILE }}.zip" *
          echo "🎁 AnyKernel3 package created at ${{ env.ANYKERNEL3_FILE }}.zip"

      - name: 🧧 Create GitHub Release => (${{ env.BUILD_DATE }})
        env:
          ANYKERNEL3_FILE: "${{ env.WORKSPACE }}/AnyKernel3-${{ env.KERNEL_NAME }}-${{ env.BUILD_DATE }}"
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        if: ${{ env.USE_ANYKERNEL3 == 'true' && env.CONFIRM_RELEASE == 'true' }}
        with:
          tag_name: v${{ env.BUILD_DATE }}.${{ github.run_number }}
          files: "${{ env.ANYKERNEL3_FILE }}.zip"
          generate_release_notes: true
